<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="anchorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  
  <!-- Outer Radio Wave / Radar rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.3" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="10" stroke-opacity="0.5" />
  
  <!-- Stylized Anchor & Phone Horn Composite -->
  <!-- Top Ring -->
  <circle cx="256" cy="140" r="32" fill="none" stroke="url(#anchorGrad)" stroke-width="20" />
  <!-- Center Stem -->
  <line x1="256" y1="160" x2="256" y2="350" stroke="url(#anchorGrad)" stroke-width="22" stroke-linecap="round" />
  <!-- Crossbar -->
  <line x1="180" y1="210" x2="332" y2="210" stroke="url(#anchorGrad)" stroke-width="20" stroke-linecap="round" />
  <!-- Curved Flukes / Phone Curve -->
  <path d="M 140 280 C 140 380, 372 380, 372 280" fill="none" stroke="url(#anchorGrad)" stroke-width="24" stroke-linecap="round" />
  <polygon points="120,280 140,250 160,280" fill="#38bdf8" />
  <polygon points="352,280 372,250 392,280" fill="#38bdf8" />
  
  <!-- SOS Signal Pulses on top right -->
  <circle cx="360" cy="140" r="14" fill="#ef4444" />
  <circle cx="360" cy="140" r="28" fill="none" stroke="#ef4444" stroke-width="4" stroke-opacity="0.6" />
</svg>
